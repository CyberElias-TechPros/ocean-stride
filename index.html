<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Ocean Stride - Seafarer Management</title>
    <meta name="title" content="Ocean Stride - Seafarer Management" />
    <meta name="description" content="Comprehensive seafarer management system for maritime companies. Manage crew assignments, payroll, compliance, and vessel operations with advanced analytics and reporting." />
    <meta name="keywords" content="seafarer management, maritime, crew management, vessel operations, payroll, compliance, shipping" />
    <meta name="author" content="Ocean Stride" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://ocean-stride.com" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/ocean-stride-icon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/ocean-stride-icon.png" />
    <link rel="apple-touch-icon" href="/ocean-stride-icon.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ocean-stride.com" />
    <meta property="og:title" content="Ocean Stride - Seafarer Management" />
    <meta property="og:description" content="Comprehensive seafarer management system for maritime companies. Manage crew assignments, payroll, compliance, and vessel operations." />
    <meta property="og:image" content="/ocean-stride-icon.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:site_name" content="Ocean Stride" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://ocean-stride.com" />
    <meta name="twitter:title" content="Ocean Stride - Seafarer Management" />
    <meta name="twitter:description" content="Comprehensive seafarer management system for maritime companies. Manage crew assignments, payroll, compliance, and vessel operations." />
    <meta name="twitter:image" content="/ocean-stride-icon.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Ocean Stride - Seafarer Management",
      "description": "Comprehensive seafarer management system for maritime companies",
      "url": "https://ocean-stride.com",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "creator": {
        "@type": "Organization",
        "name": "Ocean Stride",
        "url": "https://ocean-stride.com"
      },
      "featureList": [
        "Crew Management",
        "Vessel Operations",
        "Payroll Processing",
        "Compliance Tracking",
        "Analytics & Reporting",
        "Document Management"
      ],
      "screenshot": "/ocean-stride-icon.png"
    }
    </script>

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="msapplication-TileColor" content="#0f172a" />

    <!-- Security Headers (CSP). https: is included in connect-src so the
         deployed Cloudflare Worker origin is reachable from the Vercel page. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; media-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self';" />

    <!-- Preload critical resources -->
    <link rel="preload" href="/src/main.tsx" as="script" />
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />

    <!-- Performance hints -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ocean Stride" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
